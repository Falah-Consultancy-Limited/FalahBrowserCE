version: '3.8'

services:
  classification-engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: falah-browser-backend
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: falah-network
    external: true
