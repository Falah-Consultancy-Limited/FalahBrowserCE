<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Falah Browser — Remote Access</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d10;
      color: #f0ede8;
      font-family: 'DM Sans', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 2rem;
    }
    .lantern {
      width: 64px;
      animation: glow 3s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 12px #c9983c88); }
      50%       { filter: drop-shadow(0 0 28px #c9983ccc); }
    }
    h1 {
      font-size: 2rem;
      color: #c9983c;
      letter-spacing: 0.04em;
    }
    p { color: #9d9b96; font-size: 0.9rem; }
    .btn {
      display: inline-block;
      padding: 0.8rem 2.4rem;
      background: #c9983c;
      color: #0d0d10;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #e8b84b; }
    .note {
      font-size: 0.78rem;
      color: #5d5b57;
      margin-top: -1rem;
    }
  </style>
</head>
<body>
  <svg class="lantern" viewBox="0 0 40 52" fill="none">
    <path d="M14 12 Q20 4 26 12 L28 40 Q20 44 12 40 Z" fill="#c9983c" opacity="0.85"/>
    <ellipse cx="20" cy="26" rx="5" ry="6" fill="white" opacity="0.4"/>
    <rect x="15" y="6" width="10" height="6" rx="2" fill="#c9983c" opacity="0.7"/>
    <line x1="20" y1="6" x2="20" y2="2" stroke="#c9983c" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="13" y="40" width="14" height="4" rx="2" fill="#c9983c" opacity="0.5"/>
  </svg>

  <h1>Falah Browser</h1>
  <p>Your Spiritual Lantern in the Digital World</p>

  <a class="btn" href="/vnc.html?autoconnect=true&resize=scale&quality=7">
    Launch Browser
  </a>
  <p class="note">Opens a full-screen remote session inside your browser</p>

  <p style="color:#5d5b57;font-size:0.75rem;margin-top:1rem;">
    وَمَا تَوْفِيقِي إِلَّا بِاللَّهِ — Quran 11:88
  </p>
</body>
</html>
